readme = "README.md"
authors = [
    { name = "ihmaditaha", email = "ihmaditaha1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pip>=26.2.1",
